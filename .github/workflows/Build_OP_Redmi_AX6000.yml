name: Build_redmi_ax6000

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 5'

permissions:
  contents: read

concurrency:
  group: build-redmi-ax6000
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 释放构建空间
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force

      - name: 容器编译 AX6000 固件
        env:
          BUILD_ROOT: /tmp/autobuild-openwrt
          OUTPUT_DIR: ${{ github.workspace }}/output/redmi_ax6000
          JOBS: '4'
        run: |
          chmod +x scripts/*.sh
          scripts/build-redmi-ax6000-container.sh

      - name: 上传固件
        uses: actions/upload-artifact@v7
        with:
          name: redmi-ax6000-${{ github.run_number }}
          path: output/redmi_ax6000
          if-no-files-found: error
          retention-days: 14
